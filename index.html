<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSGC 120th Anniversary Open Day Stamp Card</title>
    <style>
        :root {
            --pale-blue: #e6f2ff;
            --gold: #ffd700;
            --dark-blue: #003366;
            --active-blue: #0066cc;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--pale-blue);
            color: var(--dark-blue);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            text-align: center;
            margin-bottom: 25px;
            max-width: 600px;
        }
        .school-badge {
            width: 90px;
            height: auto;
            margin-bottom: 10px;
        }
        h1 {
            font-size: 20px;
            margin: 5px 0;
            line-height: 1.4;
        }
        sup {
            font-size: 0.6em;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            width: 100%;
            max-width: 500px;
        }
        .zone-card {
            background: var(--dark-blue);
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid #002244;
        }
        .zone-title {
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 12px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
        }
        .stamps-container {
            display: flex;
            gap: 15px;
        }
        .stamp {
            width: 85px;
            height: 85px;
            border-radius: 12px;
            border: 2px dashed rgba(255, 255, 255, 0.4); 
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            position: relative;
            background-color: rgba(255, 255, 255, 0.1); 
            transition: all 0.3s ease;
        }
        /* Active Unlocked Stamp Look */
        .stamp.unlocked {
            border-style: solid;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            background: linear-gradient(135deg, #ffe875, var(--gold));
            border-color: #d4af37;
            color: #5c4308;
        }
        .congratulations {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            text-align: center;
            font-weight: bold;
            display: none;
            max-width: 500px;
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #c3e6cb;
            font-size: 16px;
            line-height: 1.5;
        }
        /* Integrated Pop-up Layout (Blocks standard browser alert banners) */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            max-width: 400px;
            width: 85%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.25);
            color: #333;
        }
        .modal-text {
            font-size: 16px;
            font-weight: bold;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .modal-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        .modal-btn {
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        .modal-btn.confirm {
            background-color: #dc3545;
            color: white;
        }
        .modal-btn.cancel {
            background-color: #e2e8f0;
            color: #4a5568;
        }
        /* Action Button Design Rules */
        .action-btn {
            margin-top: 25px;
            color: white;
            border: none;
            padding: 12px 35px;
            font-size: 16px;
            border-radius: 6px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .action-btn:disabled {
            background-color: #cbd5e1;
            color: #94a3b8;
            cursor: not-allowed;
            box-shadow: none;
        }
        .action-btn:not(:disabled) {
            background-color: var(--active-blue);
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .action-btn:not(:disabled):hover {
            background-color: #0052a3;
        }
    </style>
</head>
<body>

    <div class="header">
        <img class="school-badge" src="badge.png" alt="St. Stephen's Girls' College Badge" onerror="this.style.display='none'">
        <h1>St. Stephen’s Girls’ College</h1>
        <h1>120<sup>th</sup> Anniversary Open Day</h1>
        <h1>聖士提反女子中學</h1>
        <h1>一百二十周年校慶開放日</h1>
        <p style="font-size: 16px; margin: 15px 0 5px 0; font-weight: bold; color: #003366;">Digital Reward Card</p>
        <p style="font-size: 16px; margin: 5px 0 0 0; font-weight: bold; color: #003366;">電子印花收集卡</p>
    </div>

    <div id="congrats-banner" class="congratulations">
        🎉 🎉 Congratulations! You have collected all 12 stamps!<br><br>
        恭喜您！您已集齊12個印花！ 🎉 🎉
    </div>

    <div class="grid-container">
        <!-- Zone 1 -->
        <div class="zone-card">
            <div class="zone-title">Zone 1</div>
            <div class="stamps-container">
                <div class="stamp" id="Z1G"></div>
                <div class="stamp" id="Z1S"></div>
            </div>
        </div>
        <!-- Zone 2 -->
        <div class="zone-card">
            <div class="zone-title">Zone 2</div>
            <div class="stamps-container">
                <div class="stamp" id="Z2G"></div>
                <div class="stamp" id="Z2S"></div>
            </div>
        </div>
        <!-- Zone 3 -->
        <div class="zone-card">
            <div class="zone-title">Zone 3</div>
            <div class="stamps-container">
                <div class="stamp" id="Z3G"></div>
                <div class="stamp" id="Z3S"></div>
            </div>
        </div>
        <!-- Zone 4 -->
        <div class="zone-card">
            <div class="zone-title">Zone 4</div>
            <div class="stamps-container">
                <div class="stamp" id="Z4G"></div>
                <div class="stamp" id="Z4S"></div>
            </div>
        </div>
        <!-- Zone 5 -->
        <div class="zone-card">
            <div class="zone-title">Zone 5</div>
            <div class="stamps-container">
                <div class="stamp" id="Z5G"></div>
                <div class="stamp" id="Z5S"></div>
            </div>
        </div>
        <!-- Zone 6 -->
        <div class="zone-card">
            <div class="zone-title">Zone 6</div>
            <div class="stamps-container">
                <div class="stamp" id="Z6G"></div>
                <div class="stamp" id="Z6S"></div>
            </div>
        </div>
    </div>

    <button class="action-btn" id="redeem-btn" onclick="openRedeemModal()" disabled>Redeem 兌換</button>

    <div class="modal-overlay" id="custom-modal">
        <div class="modal-content">
            <div class="modal-text">
                Press to confirm redemption and reset the reward card.<br><br>
                按此確認換領並重設獎勵卡。
            </div>
            <div class="modal-buttons">
                <button class="modal-btn confirm" onclick="executeRedemption()">Confirm 確認</button>
                <button class="modal-btn cancel" onclick="closeRedeemModal()">Cancel 取消</button>
            </div>
        </div>
    </div>

    <script>
        // Mapping system linking each ID with its exact design emoji object
        const stampEmojis = {
            'Z1G': '🏮', 'Z1S': '🏯',
            'Z2G': '🎤', 'Z2S': '🤸‍♀️',
            'Z3G': '🔬', 'Z3S': '💻',
            'Z4G': '💼', 'Z4S': '📈',
            'Z5G': '🧘‍♀️', 'Z5S': '💆🏻‍♀️',
            'Z6G': '🏀', 'Z6S': '🏋🏻‍♀️'
        };

        const validCodes = Object.keys(stampEmojis);
        let progress = JSON.parse(localStorage.getItem('ssgc_stamps')) || {};

        function updateUI() {
            let unlockedCount = 0;
            validCodes.forEach(code => {
                const element = document.getElementById(code);
                if (progress[code]) {
                    element.classList.add('unlocked');
                    element.innerText = stampEmojis[code]; // Directly injects the text emoji content string
                    unlockedCount++;
                } else {
                    element.classList.remove('unlocked');
                    element.innerText = ''; // Clears the inner text area when locked empty
                }
            });

            const redeemBtn = document.getElementById('redeem-btn');
            if (unlockedCount === validCodes.length) {
                document.getElementById('congrats-banner').style.display = 'block';
                redeemBtn.disabled = false;
            } else {
                document.getElementById('congrats-banner').style.display = 'none';
